<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="聖匠会見積">
<meta name="format-detection" content="telephone=no">
<title>治療内容説明・御見積書</title>
<style>
  * { box-sizing: border-box; }
  :root{
    --navy:#1F4E78;
    --navy-light:#EAF1F8;
    --border:#E3E8ED;
    --text:#1a1a1a;
    --sub:#6b7280;
    --bg:#F4F6F8;
    --danger:#C0392B;
    --danger-bg:#FDECEA;
  }
  body{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:var(--bg); margin:0; padding:20px 12px 80px; color:var(--text);
  }
  #app{ max-width:860px; margin:0 auto; }
  h1.top-title{ text-align:center; font-size:17px; font-weight:800; margin:4px 0 2px; }
  .top-sub{ text-align:center; font-size:11.5px; color:var(--sub); margin-bottom:18px; }

  .toolbar{ display:flex; justify-content:flex-end; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  button{ font-family:inherit; cursor:pointer; border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:700; }
  .btn-primary{ background:var(--navy); color:#fff; }
  .btn-primary:hover{ background:#173a5c; }
  .btn-outline{ background:#fff; color:var(--navy); border:1.5px solid var(--navy); }
  .btn-outline:hover{ background:var(--navy-light); }
  .btn-ghost{ background:transparent; color:var(--sub); }
  .btn-danger-ghost{ background:transparent; color:var(--danger); font-size:12px; padding:4px 8px; }
  input[type=file]{ display:none; }

  .card{ background:#fff; border-radius:14px; padding:22px 26px; box-shadow:0 2px 12px rgba(0,0,0,0.06); margin-bottom:18px; }
  .card-title{ font-size:13.5px; font-weight:800; color:var(--navy); margin-bottom:12px; border-bottom:2px solid var(--navy-light); padding-bottom:6px; }

  .meta-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px 24px; font-size:13px; }
  .meta-row{ display:flex; align-items:center; gap:8px; }
  .meta-row label{ color:var(--sub); white-space:nowrap; min-width:88px; font-size:12.5px; }
  .meta-row input, .meta-row select{ flex:1; border:1px solid var(--border); border-radius:6px; padding:7px 8px; font-size:13px; font-family:inherit; }

  .master-status{ font-size:12px; color:var(--sub); margin-top:8px; }
  .master-status.ok{ color:#1a7d3a; }

  .plan-tabs{ display:flex; gap:6px; margin-bottom:12px; }
  .plan-tab{ padding:7px 16px; border-radius:8px 8px 0 0; font-size:13px; font-weight:700; cursor:pointer; background:#F0F2F5; color:var(--sub); }
  .plan-tab.active{ background:var(--navy); color:#fff; }

  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  thead th{ background:#F7F9FB; border:1px solid var(--border); padding:7px 6px; font-weight:700; color:var(--sub); text-align:left; }
  tbody td{ border:1px solid var(--border); padding:5px 6px; vertical-align:middle; }
  tbody select, tbody input{ width:100%; border:1px solid transparent; background:transparent; font-family:inherit; font-size:12.5px; padding:4px; border-radius:4px; }
  tbody select:hover, tbody input:hover{ border-color:var(--border); }
  tbody select:focus, tbody input:focus{ border-color:var(--navy); outline:none; background:#fff; }
  td.num{ text-align:right; } td.amt-cell{ text-align:right; font-weight:700; white-space:nowrap; }
  td.del-cell{ text-align:center; width:34px; }
  .note-tag{ font-size:10.5px; color:var(--sub); display:block; margin-top:1px; }
  .add-row-btn{ width:100%; padding:8px; border:1px dashed var(--border); background:#FAFBFC; color:var(--navy); font-size:12.5px; border-radius:0 0 8px 8px; margin-top:0; }
  .add-row-btn:hover{ background:var(--navy-light); }

  .total-line{ display:flex; justify-content:flex-end; align-items:center; gap:8px; background:var(--navy-light); padding:10px 14px; font-size:14px; font-weight:800; border:1px solid var(--border); border-top:none; }
  .total-line .amt{ font-size:19px; color:var(--navy); }

  .warn-banner{ background:var(--danger-bg); border:1px solid #F1B7B1; color:var(--danger); font-size:12px; padding:10px 14px; border-radius:8px; margin-top:12px; line-height:1.6; }

  .notes-label{ font-size:12.5px; font-weight:700; color:var(--sub); margin-top:4px; display:block; }
  textarea.notes{ width:100%; min-height:56px; margin-top:6px; border:1px solid var(--border); border-radius:8px; padding:10px; font-family:inherit; font-size:12.5px; resize:vertical; }

  /* ===== Preview / Print document ===== */
  #preview{ display:none; }
  .doc{ background:#fff; padding:36px 40px; box-shadow:0 2px 12px rgba(0,0,0,0.06); margin-bottom:24px; border-radius:6px; }
  .doc-header{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; }
  .doc-title{ font-size:22px; font-weight:800; letter-spacing:6px; }
  .doc-sub{ font-size:11.5px; color:var(--sub); margin-top:2px; }
  .doc-meta{ text-align:right; font-size:11.5px; color:var(--sub); line-height:1.8; }
  .doc-lead{ font-size:12.5px; margin:14px 0 10px; line-height:1.8; }
  .doc-info-grid{ display:grid; grid-template-columns:1fr 1fr; gap:4px 20px; font-size:12px; color:var(--sub); margin-bottom:14px; }
  .doc-total-box{ text-align:center; background:var(--navy-light); border:1px solid var(--border); border-radius:8px; padding:12px; margin:14px 0; }
  .doc-total-box .label{ font-size:12px; color:var(--sub); }
  .doc-total-box .amount{ font-size:26px; font-weight:800; color:var(--navy); }
  table.doc-table{ width:100%; border-collapse:collapse; font-size:12px; margin-top:6px; }
  table.doc-table th{ background:#F7F9FB; border:1px solid var(--border); padding:6px; text-align:left; }
  table.doc-table td{ border:1px solid var(--border); padding:6px; }
  table.doc-table td.r{ text-align:right; }
  table.doc-table tr.sum td{ font-weight:800; background:#FAFBFC; }
  .doc-warn{ background:var(--danger-bg); border:1px solid #F1B7B1; color:var(--danger); font-size:11.5px; padding:10px 14px; border-radius:8px; margin-top:14px; line-height:1.7; }
  .doc-guide{ font-size:11px; color:var(--sub); margin-top:18px; line-height:1.85; }
  .doc-guide-title{ font-size:12px; font-weight:700; color:var(--text); margin-bottom:4px; }
  .doc-pay-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; }
  .doc-pay-box{ border:1px solid var(--border); border-radius:8px; padding:10px 12px; font-size:11.5px; }
  .doc-pay-box .t{ font-weight:700; margin-bottom:3px; }
  .doc-sign-grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:28px; }
  .doc-sign-box{ border-top:1px solid var(--text); padding-top:6px; font-size:11px; color:var(--sub); min-height:46px; }

  .preview-toolbar{ display:flex; justify-content:space-between; margin-bottom:14px; }

  @media print{
    body{ background:#fff; padding:0; }
    #input-view, .toolbar, .preview-toolbar{ display:none !important; }
    #preview{ display:block !important; }
    .doc{ box-shadow:none; padding:14px 6px; margin-bottom:0; page-break-after:always; border-radius:0; }
    .doc:last-child{ page-break-after:auto; }
  }
</style>
</head>

<div id="app">

  <h1 class="top-title">治療内容説明・御見積書</h1>
  <div class="top-sub">医療法人社団聖匠会　｜　全て自費・税込表示</div>

  <div id="input-view">
    <div class="toolbar">
      <label class="btn-outline" for="csvInput" style="display:inline-flex;align-items:center;">料金表を読込 (CSV)</label>
      <input type="file" id="csvInput" accept=".csv" onchange="loadCsv(this.files[0])">
      <button class="btn-outline" onclick="downloadCsvTemplate()">現在の料金表をCSV出力</button>
      <button class="btn-ghost" onclick="if(confirm('入力内容をリセットしますか')) resetSheet()">リセット</button>
      <button class="btn-primary" onclick="showPreview()">見積書プレビュー</button>
    </div>

    <div class="card">
      <div class="card-title">患者情報 ／ 発行情報</div>
      <div class="meta-grid">
        <div class="meta-row"><label>発行院</label>
          <select id="clinic">
            <option>秋葉原院</option>
            <option>末広町院</option>
            <option>小伝馬町院</option>
          </select>
        </div>
        <div class="meta-row"><label>患者名</label><input type="text" id="patient" placeholder="患者名を入力"></div>
        <div class="meta-row"><label>No.</label><input type="text" id="docNo" placeholder="任意"></div>
        <div class="meta-row"><label>カルテ番号</label><input type="text" id="chartNo" placeholder="任意"></div>
        <div class="meta-row"><label>発行日</label><input type="text" id="issueDate"></div>
        <div class="meta-row"><label>有効期限</label><input type="text" id="expireDate"></div>
        <div class="meta-row"><label>対象部位</label><input type="text" id="site" placeholder="例：右上6番"></div>
        <div class="meta-row"><label>担当医</label><input type="text" id="dentist" value="野村　聖一"></div>
      </div>
      <div class="master-status" id="masterStatus">料金表: エクセルテンプレートの初期データ（84項目）を使用中</div>
    </div>

    <div class="card">
      <div class="card-title">お見積内容</div>
      <div class="plan-tabs">
        <div class="plan-tab active" id="tab-0" onclick="switchPlan(0)">プラン１</div>
        <div class="plan-tab" id="tab-1" onclick="switchPlan(1)">プラン２</div>
      </div>
      <div id="planArea"></div>
      <label class="notes-label">設計・備考</label>
      <textarea class="notes" id="notes" placeholder="治療計画の補足・備考を入力"></textarea>
    </div>
  </div>

  <div id="preview">
    <div class="preview-toolbar">
      <button class="btn-outline" onclick="backToInput()">← 入力に戻る</button>
      <button class="btn-primary" onclick="window.print()">印刷 / PDF保存</button>
    </div>
    <div style="font-size:11px;color:var(--sub);margin-bottom:14px;">⚠ 印刷ダイアログで「ヘッダとフッタ」= OFF、拡大率＝100%、余白＝なし を確認してください</div>
    <div id="docContainer"></div>
  </div>

</div>

function fmt(n){ return "¥"+Number(n||0).toLocaleString("ja-JP"); }
function findItem(name){ return MASTER.find(i=>i.name===name); }
function categories(){ return [...new Set(MASTER.map(i=>i.category))].filter(c=>c!=="設定"); }
function getLoanRate(){
  const item = MASTER.find(i=>i.category==="設定" && i.name==="デンタルローン年率");
  if(item && typeof item.price === "number" && item.price > 0) return item.price / 100;
  return 0.039;
}
function escapeAttr(s){ return String(s).replace(/"/g,"&quot;"); }

function init(){
  document.getElementById("issueDate").value = todayStr(0);
  document.getElementById("expireDate").value = todayStr(3);
  renderPlan();
}

function switchPlan(idx){
  currentPlan = idx;
  document.getElementById("tab-0").classList.toggle("active", idx===0);
  document.getElementById("tab-1").classList.toggle("active", idx===1);
  renderPlan();
}

function renderPlan(){
  const plan = plans[currentPlan];
  const total = plan.rows.reduce((s,r)=> s + (r.priceLabel? 0 : Number(r.price||0)*Number(r.qty||0)), 0);
  const rowsHtml = plan.rows.map((row,idx)=>renderRow(idx,row)).join("");
  document.getElementById("planArea").innerHTML = `
    <table>
      <thead><tr>
        <th style="width:14%">区分</th><th style="width:30%">項目</th>
        <th style="width:13%">単価</th><th style="width:9%">数量</th>
        <th style="width:14%">金額</th><th style="width:6%"></th>
      </tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
    <button class="add-row-btn" onclick="addRow()">＋ 項目を追加</button>
    <div class="total-line">お見積合計（税込）　<span class="amt">${fmt(total)}</span></div>
  `;
}

function renderRow(idx,row){
  const cats = categories();
  const catOpts = cats.map(c=>`<option value="${c}" ${row.category===c?"selected":""}>${c}</option>`).join("");
  const items = MASTER.filter(i=>i.category===row.category);
  const itemOpts = items.map(i=>`<option value="${escapeAttr(i.name)}" ${row.name===i.name?"selected":""}>${i.name}</option>`).join("");
  const priceVal = row.priceLabel ? row.priceLabel : row.price;
  const amount = row.priceLabel ? "" : fmt(Number(row.price||0)*Number(row.qty||0));
  const noteHtml = row.note ? `<span class="note-tag">${row.note}</span>` : "";
  return `
    <tr>
      <td><select onchange="updateRow(${idx},'category',this.value)"><option value="">選択</option>${catOpts}</select></td>
      <td><select onchange="updateRow(${idx},'name',this.value)"><option value="">-- 項目を選択 --</option>${itemOpts}</select></td>
      <td class="num"><input type="text" value="${priceVal}" onblur="updateRow(${idx},'priceOverride',this.value)">${noteHtml}</td>
      <td class="num"><input type="number" min="0" value="${row.qty}" oninput="updateRow(${idx},'qty',this.value)"></td>
      <td class="amt-cell">${amount}</td>
      <td class="del-cell"><button class="btn-danger-ghost" onclick="deleteRow(${idx})">×</button></td>
    </tr>`;
}

function addRow(){ plans[currentPlan].rows.push(makeRow()); renderPlan(); }
function deleteRow(idx){
  plans[currentPlan].rows.splice(idx,1);
  if(plans[currentPlan].rows.length===0) plans[currentPlan].rows.push(makeRow());
  renderPlan();
}
function updateRow(idx, field, value){
  const row = plans[currentPlan].rows[idx];
  if(field==="category"){ row.category=value; row.name=""; row.price=0; row.priceLabel=null; row.note=""; }
  else if(field==="name"){
    const item = findItem(value);
    row.name=value;
    if(item){ row.price=item.price; row.priceLabel=item.priceLabel; row.note=item.note; row.category=item.category; }
    else { row.price=0; row.priceLabel=null; row.note=""; }
  } else if(field==="qty"){ row.qty=value; }
  else if(field==="priceOverride"){
    const trimmed = value.trim();
    const n = Number(trimmed.replace(/[^0-9.\-]/g,""));
    if(trimmed!=="" && !isNaN(n) && /^[0-9,.\-¥]+$/.test(trimmed)){ row.price=n; row.priceLabel=null; }
    else if(trimmed===""){ row.price=0; row.priceLabel=null; }
    else { row.priceLabel=value; }
  }
  renderPlan();
}
function resetSheet(){
  plans = [ {rows:[makeRow()]}, {rows:[makeRow()]} ];
  document.getElementById("patient").value="";
  document.getElementById("docNo").value="";
  document.getElementById("chartNo").value="";
  document.getElementById("site").value="";
  document.getElementById("notes").value="";
  document.getElementById("issueDate").value=todayStr(0);
  document.getElementById("expireDate").value=todayStr(3);
  currentPlan=0; switchPlan(0);
}

/* ---- CSV import/export ---- */
function loadCsv(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const text = e.target.result;
    const lines = text.split(/\r?\n/).filter(l=>l.trim()!=="");
    const rows = lines.slice(1).map(l=>{
      const cols = parseCsvLine(l);
      const [cat,name,price,note] = cols;
      const num = Number(String(price).replace(/[^0-9.\-]/g,""));
      const isNum = price!=="" && !isNaN(num) && /^[0-9,.\-¥]+$/.test(String(price).trim());
      return { category:cat, name:name, price: isNum? num:0, priceLabel: isNum? null: price, note: note||"" };
    }).filter(r=>r.category && r.name);
    if(rows.length===0){ alert("CSVを読み込めませんでした。区分,項目,単価,備考 の列で作成してください。"); return; }
    MASTER = rows;
    document.getElementById("masterStatus").textContent = `料金表: ${file.name} を読込済み（${rows.length}項目）`;
    document.getElementById("masterStatus").classList.add("ok");
    renderPlan();
  };
  reader.readAsText(file, "UTF-8");
}
function parseCsvLine(line){
  const result=[]; let cur=""; let inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){ inQ=!inQ; continue; }
    if(c===',' && !inQ){ result.push(cur); cur=""; continue; }
    cur+=c;
  }
  result.push(cur);
  return result;
}
function downloadCsvTemplate(){
  let csv = "区分,項目,単価,備考\n";
  MASTER.forEach(i=>{
    const price = i.priceLabel ? i.priceLabel : i.price;
    csv += `${i.category},${i.name},${price},${i.note||""}\n`;
  });
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "price_master.csv"; a.click();
  URL.revokeObjectURL(url);
}

/* ---- Preview / print document ---- */
function showPreview(){
  document.getElementById("input-view").style.display="none";
  document.getElementById("preview").style.display="block";
  renderDocs();
}
function backToInput(){
  document.getElementById("input-view").style.display="block";
  document.getElementById("preview").style.display="none";
}

function renderDocs(){
  const meta = {
    clinic: document.getElementById("clinic").value,
    patient: document.getElementById("patient").value,
    docNo: document.getElementById("docNo").value,
    chartNo: document.getElementById("chartNo").value,
    issueDate: document.getElementById("issueDate").value,
    expireDate: document.getElementById("expireDate").value,
    site: document.getElementById("site").value,
    dentist: document.getElementById("dentist").value,
    notes: document.getElementById("notes").value
  };
  const planTitles = ["プラン１","プラン２"];
  const container = document.getElementById("docContainer");
  container.innerHTML = "";
  plans.forEach((plan, idx)=>{
    const validRows = plan.rows.filter(r=>r.name);
    if(validRows.length===0) return;
    container.appendChild(renderDoc(meta, planTitles[idx], validRows));
  });
  if(container.innerHTML===""){
    container.innerHTML = "<div class='card'>項目が選択されていません。入力に戻って項目を選択してください。</div>";
  }
}

const LOAN_ANNUAL_RATE_FALLBACK = 0.039; // 料金表に「設定/デンタルローン年率」が無い場合のみ使用

function renderLoanEstimate(total){
  if(!total || total <= 0) return "";
  const counts = [12,24,36,48,60,84];
  const rate = getLoanRate();
  const r = rate / 12;
  const rowsHtml = counts.map(n=>{
    const raw = r === 0 ? total / n : total * r * Math.pow(1+r, n) / (Math.pow(1+r, n) - 1);
    const monthly = Math.round(raw / 10) * 10;
    return `<td class="r">${n}回<br><b>${fmt(monthly)}</b>/月</td>`;
  }).join("");
  const rateLabel = (rate*100).toFixed(1);
  return `
    <div style="font-size:11px;color:var(--sub);margin-top:14px;">
      <div style="font-weight:700;color:var(--text);margin-bottom:4px;">◆ デンタルローンのお支払い目安（実質年率 ${rateLabel}%）</div>
      <table class="doc-table" style="font-size:11px;">
        <tbody><tr>${rowsHtml}</tr></tbody>
      </table>
      <div style="margin-top:4px;">※ 上記は実質年率${rateLabel}%（元利均等返済）で計算した概算目安です。金利は変更される場合があり、実際の月々のお支払額は審査結果により変動します。詳細はローン会社の審査時にご確認ください。</div>
    </div>
  `;
}

function renderDoc(meta, planTitle, rows){
  const total = rows.reduce((s,r)=> s + (r.priceLabel? 0 : Number(r.price||0)*Number(r.qty||0)), 0);
  const rowsHtml = rows.map(r=>{
    const amt = r.priceLabel ? r.priceLabel : fmt(Number(r.price||0)*Number(r.qty||0));
    const unit = r.priceLabel ? r.priceLabel : fmt(r.price);
    return `<tr><td>${r.category}</td><td>${r.name}${r.note?`<div style="font-size:10px;color:var(--sub);">${r.note}</div>`:""}</td><td class="r">${r.qty}</td><td class="r">${unit}</td><td class="r">${amt}</td></tr>`;
  }).join("");

  const hasNoWarranty = rows.some(r => (r.note||"").includes("保証") === false && /インプラント/.test(r.name) && !/2年保証|10年保証/.test(r.note||""));

  const doc = document.createElement("div");
  doc.className = "doc";
  doc.innerHTML = `
    <div class="doc-header">
      <div>
        <div class="doc-title">御 見 積 書</div>
        <div class="doc-sub">Estimation of Dental Treatment ／ ${meta.clinic}${planTitle?"　"+planTitle:""}</div>
      </div>
      <div class="doc-meta">
        No. ${meta.docNo||"－"}<br>
        発行日: ${meta.issueDate}<br>
        有効期限: ${meta.expireDate}
      </div>
    </div>
    <div class="doc-info-grid">
      <div>患者名: ${meta.patient||"－"} 様</div>
      <div>担当医: ${meta.dentist}</div>
      <div>カルテ番号: ${meta.chartNo||"－"}</div>
      <div>対象部位: ${meta.site||"－"}</div>
    </div>
    <div class="doc-lead">この度は当院での治療をご検討いただき、誠にありがとうございます。下記の通りお見積り申し上げます。ご不明点は担当医までお気軽にご相談ください。</div>

    <div class="doc-total-box">
      <div class="label">お見積合計金額</div>
      <div class="amount">${fmt(total)}（税込）</div>
    </div>

    <table class="doc-table">
      <thead><tr><th>区分</th><th>項目</th><th class="r">数量</th><th class="r">単価</th><th class="r">金額</th></tr></thead>
      <tbody>${rowsHtml}
        <tr class="sum"><td colspan="4">合計（税込）</td><td class="r">${fmt(total)}</td></tr>
      </tbody>
    </table>

    ${meta.notes ? `<div style="font-size:11.5px;margin-top:12px;"><b>設計・備考</b><br>${meta.notes.replace(/\n/g,"<br>")}</div>` : ""}

    ${hasNoWarranty ? `<div class="doc-warn"><b>⚠ 保証に関するご案内</b><br>本プランに含まれる項目の保証条件は上表の備考欄をご確認ください。保証外となる場合、脱離・破損時の再治療費用は全額自己負担となる場合があります。事前にご説明のうえ、同意サインを頂戴してください。</div>` : ""}

    ${renderLoanEstimate(total)}

    <div class="doc-guide">
      <div class="doc-guide-title">■ 治療内容とお支払いに関するご案内</div>
      ・本見積書に記載の金額はすべて自由診療・税込金額です。<br>
      ・治療計画は診断結果により変更となる場合があります。その際は改めてご説明・再見積りいたします。<br>
      ・本見積書の有効期限は発行日より3ヶ月間です。<br>
      ・単価は2026年1月料金表に基づきます。料金は予告なく改定する場合があります。
    </div>

    <div class="doc-pay-grid">
      <div class="doc-pay-box"><div class="t">お支払い方法</div>現金・クレジットカード各種／デンタルローン(最大84回)対応／各種キャッシュレス決済対応</div>
      <div class="doc-pay-box"><div class="t">医療費控除</div>自費診療は医療費控除の対象となる場合があります。領収書は大切に保管ください。</div>
    </div>

    <div class="doc-sign-grid">
      <div class="doc-sign-box">担当医サイン<br>Doctor</div>
      <div class="doc-sign-box">患者様同意サイン<br>Patient / Date</div>
    </div>
  `;
  return doc;
}
